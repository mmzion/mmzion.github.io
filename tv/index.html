<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zion Sports — Ultimate OTT</title>
    <base href="https://fifalive.click/">

    <!-- Open Graph Meta Tags for Premium Social Preview -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Zion Sports — Ultimate OTT">
    <meta property="og:description" content="Watch Live FIFA Premium smoothly on Zion Sports.">
    <meta property="og:image" content="https://i.ibb.co.com/ymJhZWxG/1000075445-clean.png">

    <!-- Premium Frameworks & Fonts -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --purple-primary: #8b5cf6;
            --purple-glow: rgba(139, 92, 246, 0.4);
            --cyan-accent: #06b6d4;
            --cyan-glow: rgba(6, 182, 212, 0.4);
            --dark-bg: #03000a;
            --panel-glass: rgba(15, 10, 30, 0.75);
            --card-border: rgba(139, 92, 246, 0.2);
        }

        body { 
            background-color: var(--dark-bg) !important; 
            color: #f8fafc !important; 
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh; 
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            letter-spacing: -0.2px;
        }

        /* 🌌 আল্ট্রা প্রিমিয়াম ব্র্যান্ডেড নেভিগেশন বার */
        .ott-nav { 
            background: rgba(3, 0, 10, 0.85) !important; 
            backdrop-filter: blur(25px); 
            -webkit-backdrop-filter: blur(25px);
            height: 60px; 
            display: flex; 
            align-items: center; 
            padding: 0 20px; 
            border-bottom: 1px solid rgba(139, 92, 246, 0.2); 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }

        .brand-logo {
            font-weight: 800;
            font-size: 18px;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #fff 30%, var(--purple-primary) 70%, var(--cyan-accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-logo i {
            font-size: 22px;
            background: linear-gradient(135deg, var(--purple-primary), var(--cyan-accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 8px var(--purple-glow));
        }

        /* 📺 ইন্টেলিজেন্ট নো-ব্ল্যাক-বার প্লেয়ার উইন্ডো */
        .theater-screen-sticky-wrapper {
            position: -webkit-sticky;
            position: sticky;
            top: 0;
            z-index: 2050;
            background: #000;
            width: 100%;
            box-shadow: 0 15px 40px rgba(0,0,0,0.9);
        }
        
        .theater-screen { 
            position: relative; 
            width: 100%; 
            aspect-ratio: 16 / 9; 
            overflow: hidden; 
            background: #000;
        }
        
        #plyr-wrapper { width: 100%; height: 100%; position: absolute; top:0; left:0; z-index: 1; }
        
        /* 🚨 ভিডিও যেন কোনো ফাঁকা জায়গা না রেখে স্ক্রিন জুড়ে ফিট হয় */
        video { 
            width: 100% !important; 
            height: 100% !important; 
            background: #000; 
            object-fit: cover !important; 
        }
        .plyr video { object-fit: cover !important; }

        .player-click-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: calc(100% - 55px);
            z-index: 2;
            pointer-events: auto;
            cursor: pointer;
        }

        .ott-dashboard { padding: 16px; }
        .stream-details { 
            background: var(--panel-glass); 
            padding: 14px 18px; 
            border-radius: 16px; 
            border: 1px solid rgba(255, 255, 255, 0.05); 
            display: flex; 
            align-items: center; 
            gap: 14px; 
            position: relative;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
        }

        .active-logo-img { 
            width: 36px; 
            height: 40px; 
            object-fit: contain; 
            border-radius: 8px; 
            background: rgba(255,255,255,0.06); 
            padding: 3px; 
            border: 1px solid rgba(139, 92, 246, 0.3); 
        }
        
        .badge-live { 
            background: linear-gradient(135deg, #ef4444, #b91c1c); 
            color: #fff; 
            font-size: 10px; 
            padding: 4px 10px; 
            border-radius: 6px; 
            text-transform: uppercase; 
            font-weight: 800; 
            letter-spacing: 0.5px;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.4);
        }
        
        .btn-reload-stream {
            margin-left: auto;
            background: rgba(255, 255, 255, 0.04);
            color: #cbd5e1;
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-reload-stream:hover { 
            background: rgba(139, 92, 246, 0.15); 
            color: #f5f3ff;
            border-color: var(--purple-primary);
        }

        /* 👑 আল্ট্রা-লাক্সারি ফুলস্ক্রিন এক্সপ্যান্ডার বাটন */
        .btn-giant-fullscreen {
            width: 100%;
            background: linear-gradient(135deg, var(--purple-primary), #6d28d9);
            color: #fff;
            border: none;
            padding: 16px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 14px;
            box-shadow: 0 6px 25px var(--purple-glow);
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            transition: all 0.25s ease;
        }
        .btn-giant-fullscreen:hover {
            transform: scale(1.005) translateY(-1px);
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.6);
            background: linear-gradient(135deg, #9333ea, var(--purple-primary));
        }

        .horizontal-panel { 
            margin-top: 16px; 
            background: var(--panel-glass); 
            padding: 16px; 
            border-radius: 18px; 
            border: 1px solid rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
        }
        .iptv-grid-row { display: flex; flex-direction: column; gap: 12px; }

        /* ✨ লাক্সারি মেটাল-গ্লাস কার্ড বাটন ডিজাইন */
        .channel-card { 
            background: rgba(255, 255, 255, 0.02); 
            padding: 20px; 
            border-radius: 16px; 
            cursor: pointer; 
            display: flex; 
            flex-direction: row; 
            align-items: center; 
            justify-content: flex-start; 
            gap: 18px;
            border: 1px solid var(--card-border); 
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); 
            width: 100%;
            position: relative;
        }
        .channel-card:hover { 
            border-color: rgba(6, 182, 212, 0.5); 
            background: rgba(6, 182, 212, 0.05);
            transform: scale(1.005) translateY(-1px);
        }
        .channel-card.active { 
            border: 2px solid var(--cyan-accent); 
            background: rgba(6, 182, 212, 0.12); 
            box-shadow: 0 0 25px rgba(6, 182, 212, 0.25); 
        }
        .channel-card.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 25%;
            height: 50%;
            width: 4px;
            background: var(--cyan-accent);
            border-radius: 0 4px 4px 0;
            box-shadow: 0 0 10px var(--cyan-accent);
        }
        
        .logo-img { 
            width: 46px; 
            height: 46px; 
            object-fit: contain; 
            border-radius: 10px; 
            padding: 3px; 
            background: rgba(255,255,255,0.05); 
            border: 1px solid rgba(255,255,255,0.08);
        }
        .card-info-box { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
        .card-name { font-weight: 700; font-size: 16px; color: #f8fafc; text-transform: uppercase; letter-spacing: 0.5px; }
        .card-group { 
            font-size: 9px; 
            color: #22d3ee; 
            text-transform: uppercase; 
            font-weight: 800; 
            background: rgba(6, 182, 212, 0.15); 
            padding: 3px 10px; 
            border-radius: 20px; 
            letter-spacing: 0.5px;
        }

        /* 🎨 বিশ্বমানের কাস্টম গ্লোয়িং প্লেয়ার কন্ট্রোল থিম */
        .plyr--video { 
            --plyr-color-main: var(--purple-primary); 
            --plyr-video-control-background-hover: rgba(139, 92, 246, 0.25);
            border-radius: inherit;
        }
        .plyr__control--overlaid {
            background: var(--purple-primary) !important;
            box-shadow: 0 0 30px var(--purple-glow) !important;
        }
        .plyr__controls {
            background: linear-gradient(to top, rgba(3, 0, 10, 0.95), rgba(3, 0, 10, 0.4), rgba(0,0,0,0)) !important;
            padding: 25px 15px 15px !important;
        }
        .plyr__volume input[type=range] {
            max-width: 70px !important;
        }

        @media (min-width: 992px) {
            .ott-main-layout {
                display: grid;
                grid-template-columns: 64% 36%;
                gap: 24px;
                padding: 30px;
                align-items: start;
                max-width: 1400px;
                margin: 0 auto;
            }
            .left-column-wrapper {
                position: sticky;
                top: 30px;
                z-index: 10;
            }
            .theater-screen-sticky-wrapper {
                position: relative;
                border-radius: 20px;
                overflow: hidden;
                box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            }
            .ott-dashboard { padding: 0 !important; }
            .horizontal-panel {
                max-height: calc(100vh - 190px);
                overflow-y: auto;
                padding-right: 6px;
            }
            .horizontal-panel::-webkit-scrollbar { width: 6px; }
            .horizontal-panel::-webkit-scrollbar-thumb { background: var(--purple-primary); border-radius: 10px; }
        }
    </style>
</head>
<body>

    <!-- 🌌 প্রিমিয়াম টপ বার -->
    <nav class="ott-nav">
        <div class="brand-logo">
            <i class="bi bi-play-circle-fill"></i> Zion Sports
        </div>
    </nav>

    <div class="ott-main-layout">
        
        <!-- বাম পাশের কন্টেন্ট কলাম (ভিডিও এবং মেটাডাটা) -->
        <div class="left-column-wrapper">
            <div class="theater-screen-sticky-wrapper" id="videoContainer">
                <div class="theater-screen">
                    <div id="plyr-wrapper">
                        <video id="player" playsinline controls autoplay></video>
                        <div class="player-click-overlay" id="player-overlay"></div>
                    </div>
                </div>
            </div>
            
            <div class="stream-details mt-3">
                <span class="badge-live">Live</span>
                <img id="activeLogo" src="" class="active-logo-img" alt="logo" onerror="this.style.display='none'">
                <h1 class="h6 m-0" id="activeTitle">Loading Premium Stream...</h1>
                
                <button class="btn-reload-stream" onclick="reloadCurrentStream()"><i class="bi bi-arrow-clockwise"></i> Reload</button>
            </div>

            <!-- 👑 বিশ্বমানের ফুলস্ক্রিন এবং অটো-রোটেট ইন্টিগ্রেশন বাটন -->
            <button class="btn-giant-fullscreen" onclick="goPremiumFullscreen()">
                <i class="bi bi-fullscreen-exit" style="transform: rotate(45deg); display: inline-block;"></i> Expand Content & Rotate
            </button>
        </div>

        <!-- ডান পাশের কন্টেন্ট কলাম (লিস্ট প্যানেল) -->
        <div class="container-fluid ott-dashboard">
            <div class="horizontal-panel mt-0">
                <div id="fifaTabPanel" class="iptv-grid-row">
                    <!-- বাটনগুলো এখানে ইনজেক্ট হবে -->
                </div>
            </div>
            <div class="text-center mt-5 text-muted" style="font-size: 10px; opacity: 0.25; letter-spacing: 0.5px;">© 2026 Zion Sports • Developed with Perfection</div>
        </div>

    </div>

    <!-- Core Player Script Engines -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

    <script>
        // 📥 হাই-স্পিড সচল দুই সার্ভারের ডেটাবেজ
        const fifaChannels = [
            { "name": "FIFA Live (Server 1)", "url": "https://cdn011.viaplus.site/fox-usa.m3u8", "logo": "https://upload.wikimedia.org/wikipedia/en/thumb/1/17/2026_FIFA_World_Cup_emblem.svg/250px-2026_FIFA_World_Cup_emblem.svg.png" },
            { "name": "FIFA Live (Server 2)", "url": "https://cdn011.viaplus.site/telemundo-usa.m3u8", "logo": "https://upload.wikimedia.org/wikipedia/en/thumb/1/17/2026_FIFA_World_Cup_emblem.svg/250px-2026_FIFA_World_Cup_emblem.svg.png" }
        ];

        const video = document.getElementById('player');
        let hls = null;
        let currentActiveUrl = ''; 
        let savedCurrentChannelData = null;

        const plyr = new Plyr(video, { 
            autoplay: true, 
            controls: ['play-large', 'play', 'progress', 'current-time', 'volume', 'mute', 'pip', 'fullscreen'] 
        });

        const overlay = document.getElementById('player-overlay');
        overlay.addEventListener('click', (e) => {
            e.stopPropagation();
            if(video.muted) {
                video.muted = false;
                video.volume = 1.0;
            }

            const controls = document.querySelector('.plyr__controls');
            if (controls) {
                const isControlsVisible = controls.style.opacity === '1' || 
                                          window.getComputedStyle(controls).visibility === 'visible' ||
                                          controls.classList.contains('plyr__controls--visible');
                
                if (isControlsVisible) {
                    if (video.paused) video.play();
                    else video.pause();
                } else {
                    plyr.toggleControls(true);
                }
            }
        });

        function renderLists() {
            const panel = document.getElementById("fifaTabPanel");
            if (!panel) return;
            panel.innerHTML = "";

            fifaChannels.forEach((ch, idx) => {
                const card = document.createElement("div");
                card.className = "channel-card";

                card.onclick = (function(index) {
                    return function() {
                        switchStandardChannel(fifaChannels[index], this);
                    };
                })(idx);

                card.innerHTML = `
                    <img src="${ch.logo}" class="logo-img" alt="${ch.name}">
                    <div class="card-info-box">
                        <div class="card-name">${ch.name}</div>
                        <div class="card-group">LIVE SERVER</div>
                    </div>
                `;
                panel.appendChild(card);
            });
        }

        function switchStandardChannel(channelObj, el) {
            savedCurrentChannelData = channelObj;
            currentActiveUrl = channelObj.url; 
            
            document.querySelectorAll('.channel-card').forEach(c => c.classList.remove('active'));
            if(el) el.classList.add('active');
            
            document.getElementById('activeTitle').innerText = channelObj.name;
            const activeLogo = document.getElementById('activeLogo');
            activeLogo.src = channelObj.logo; 
            activeLogo.style.display = 'inline-block';
            
            if (hls) { hls.destroy(); hls = null; }

            if (Hls.isSupported()) {
                // আল্ট্রা লো-লেটেন্সি ও হাই বাফারিং অপ্টিমাইজেশন
                hls = new Hls({
                    maxBufferLength: 30,
                    maxMaxBufferLength: 60,
                    enableWorker: true
                });
                hls.loadSource(channelObj.url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.muted = false; 
                    video.volume = 1.0;
                    video.play().catch(() => {
                        video.muted = true;
                        video.play().then(handleMuteBypass);
                    });
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = channelObj.url;
                video.play();
            }
        }

        function handleMuteBypass() {
            const unscrapeAudioLock = () => {
                video.muted = false;
                video.volume = 1.0;
                document.removeEventListener('click', unscrapeAudioLock);
                document.removeEventListener('touchend', unscrapeAudioLock);
            };
            document.addEventListener('click', unscrapeAudioLock);
            document.addEventListener('touchend', unscrapeAudioLock);
        }

        function reloadCurrentStream() {
            if (savedCurrentChannelData) {
                switchStandardChannel(savedCurrentChannelData, document.querySelector('.channel-card.active'));
            }
        }

        // 🔄 ফুলস্ক্রিন ও গাইরোস্কোপ অরিয়েন্টেশন মাস্টার-লক ট্রিপ
        function goPremiumFullscreen() {
            const container = document.getElementById('videoContainer');
            if (!document.fullscreenElement) {
                if (container.requestFullscreen) {
                    container.requestFullscreen();
                } else if (container.webkitRequestFullscreen) {
                    container.webkitRequestFullscreen();
                } else if (video.webkitEnterFullscreen) {
                    video.webkitEnterFullscreen();
                }
                
                // মোবাইল ডিভাইসে ভিডিও ফুলস্ক্রিনের সাথে অটোমেটিক আড়াআড়ি (Landscape) মোডে লক হবে
                if (screen.orientation && screen.orientation.lock) {
                    screen.orientation.lock('landscape').catch(function(err) {
                        console.log("Device orientation lock bypassed smoothly.");
                    });
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderLists();
            
            setTimeout(() => {
                // 🏆 'FIFA Live (Server 2)' [Index 1] কে ডিফল্ট চ্যানেল হিসেবে ফার্স্ট প্লে লোড করা হলো
                const defaultCard = document.querySelectorAll('#fifaTabPanel .channel-card')[1]; 
                if (defaultCard) {
                    switchStandardChannel(fifaChannels[1], defaultCard);
                }
            }, 400);
        });
    </script>
</body>
</html>
