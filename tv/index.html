            { "name": "MU | SANGEET BANGLA", "logo": "https://static.wikia.nocookie.net/logopedia/images/d/da/Sangeet_Bangla_logo_2006.png", "url": "https://cdn-4.pishow.tv/live/1143/master.m3u8" },
            { "name": "DD Bangla", "logo": "https://static.wikia.nocookie.net/logopedia/images/c/ca/Dd_2019.webp", "url": "https://d3qs3d2rkhfqrt.cloudfront.net/out/v1/7ff57cc9046b4c188b51a0d506f36e7f/index_3.m3u8" },
            { "name": "Khushboo Bangla", "logo": "https://static.wikia.nocookie.net/logopedia/images/e/e1/Khushboo_Bangla_logo_2017.png", "url": "https://cdn-4.pishow.tv/live/1473/master.m3u8" },
            { "name": "Colors Bangla HD", "logo": "https://static.wikia.nocookie.net/logopedia/images/3/3e/Colors_Bangla_HD.jpg", "url": "https://iptvcable.netlify.app/Altogether-007/Kolkata/ColorsBanglaHD.m3u8" },
            { "name": "Bangla+ HD", "logo": "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEir8DIISD_3Ay4E2H__HTS4VFP7VXskYcIgkufU45epPzAFDKObL2D_p6mOal9B0RJpyaiA3feJuyaL8yvd0x-2nykRjc1pZPwT_aAGwmwFb4bEJf8oVDgty5NF30gzWlwHvh2P2c49pP2P8383ili_yboK1uSyqELcZygHTpSwru1VeK0mMwceugT5QLw/s1600/NadimRazaTVLogoDesign%282%29_copy_900x900_1.png", "url": "https://live-stream.utkalbongo.com/hls/livebanglatvstream.m3u8" },
            { "name": "SONY AATH HD", "logo": "https://static.wikia.nocookie.net/logopedia/images/0/00/SONY_AATH.png", "url": "https://live20.bozztv.com/giatvplayout7/giatv-209611/index.m3u8" },
            { "name": "Rajdhani TV", "logo": "https://rajdhanitv.online/assets/images/logo/1757970614logo%20footer.png", "url": "https://stream.shariarsuvo.com/hls5/rajdhanicable.m3u8" }
        ];

        const video = document.getElementById('player');
        let hls = null;
        let shakaPlayer = null;
        let currentActiveUrl = ''; 
        let currentChannelType = 'hls';

        const plyr = new Plyr(video, { 
            autoplay: true, 
            controls: ['play-large', 'play', 'progress', 'current-time', 'pip', 'fullscreen'] 
        });

        // ফুলস্ক্রিন ও ওরিয়েন্টেশন হ্যান্ডলার
        plyr.on('enterfullscreen', () => {
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(err => console.log("Orientation auto-skip:", err));
            }
        });
        plyr.on('exitfullscreen', () => {
            if (screen.orientation && screen.orientation.unlock) {
                screen.orientation.unlock();
            }
        });

        const overlay = document.getElementById('player-overlay');

        overlay.addEventListener('click', (e) => {
            e.stopPropagation();
            if(video.muted) {
                video.muted = false;
                video.volume = 1.0;
            }

            const controls = document.querySelector('.plyr__controls');
            if (controls) {
                const isControlsVisible = controls.style.opacity === '1' || 
                                          window.getComputedStyle(controls).visibility === 'visible' ||
                                          controls.classList.contains('plyr__controls--visible');
                
                if (isControlsVisible) {
                    if (video.paused) video.play();
                    else video.pause();
                } else {
                    plyr.toggleControls(true);
                }
            }
        });

        // 🔄 ডাইনামিক রেন্ডারিং মেকানিজম (FIFA Premium ক্যাটাগরি)
        function renderFifaSection() {
            const panel = document.getElementById("fifaTabPanel");
            if (!panel) return;
            panel.innerHTML = "";

            fifaChannels.forEach((ch, idx) => {
                const card = document.createElement("div");
                card.className = "channel-card";
                if(ch.type === "redirect") card.classList.add("tsports-highlight", "redirect-card");

                card.onclick = function() {
                    if(ch.type === "redirect") {
                        handleRedirectChannel(ch.url);
                    } else {
                        switchStandardChannel(ch.url, ch.name, ch.logo, this, ch.type, ch.kid, ch.key);
                    }
                };

                card.innerHTML = `
                    <img src="${ch.logo}" class="logo-img" alt="${ch.name}" onerror="this.src='https://upload.wikimedia.org/wikipedia/en/thumb/1/17/2026_FIFA_World_Cup_emblem.svg/250px-2026_FIFA_World_Cup_emblem.svg.png'">
                    <div class="card-name">${ch.name}</div>
                `;
                panel.appendChild(card);
            });
        }

        // 🔄 ডাইনামিক রেন্ডারিং মেকানিজম (Live Sports ক্যাটাগরি)
        function renderSportsSection() {
            const panel = document.getElementById("sportsTabPanel");
            if (!panel) return;
            panel.innerHTML = ""; 

            sportsChannels.forEach((ch, idx) => {
                const card = document.createElement("div");
                card.className = "channel-card";
                
                card.onclick = function() {
                    switchStandardChannel(ch.url, ch.name, ch.logo, this, 'hls');
                };

                card.innerHTML = `
                    <img src="${ch.logo}" class="logo-img" alt="${ch.name}" onerror="this.src='https://tstatic.akash-go.com/cms-ui/images/custom-content/1770378074527.png'">
                    <div class="card-name">${ch.name}</div>
                `;
                panel.appendChild(card);
            });
        }

        // 🔄 ডাইনামিক রেন্ডারিং মেকানিজম (Bangla TV ক্যাটাগরি)
        function renderBanglaSection() {
            const panel = document.getElementById("banglaTabPanel");
            if (!panel) return;
            panel.innerHTML = ""; 

            banglaChannels.forEach((ch, idx) => {
                const card = document.createElement("div");
                card.className = "channel-card";
                
                card.onclick = function() {
                    switchStandardChannel(ch.url, ch.name, ch.logo, this, 'hls');
                };

                card.innerHTML = `
                    <img src="${ch.logo}" class="logo-img" alt="${ch.name}" onerror="this.src='https://static.wikia.nocookie.net/logopedia/images/1/12/BTV_HD_Logo.svg'">
                    <div class="card-name">${ch.name}</div>
                `;
                panel.appendChild(card);
            });
        }

        // 🔄 অল-ইন-ওয়ান মাল্টি-ইঞ্জিন কোর প্লেয়ার (HLS + DASH DRM ClearKey)
        async function switchStandardChannel(url, title, logoUrl, el, streamType = 'hls', kid = '', key = '') {
            currentActiveUrl = url; 
            currentChannelType = streamType;
            
            document.querySelectorAll('.channel-card').forEach(c => c.classList.remove('active'));
            if(el) el.classList.add('active');
            
            document.getElementById('activeTitle').innerText = title;
            const activeLogo = document.getElementById('activeLogo');
            if (logoUrl) {
                activeLogo.src = logoUrl; activeLogo.style.display = 'inline-block';
            } else {
                activeLogo.style.display = 'none';
            }
            
            // পূর্ববর্তী প্লেয়ার ইঞ্জিন ক্লিনআপ
            if (hls) { hls.destroy(); hls = null; }
            if (shakaPlayer) { await shakaPlayer.destroy(); shakaPlayer = null; }

            // ১. যদি চ্যানেলটি DASH (.mpd) প্রোটেক্টেড হয়
            if (streamType === 'dash' || url.includes('.mpd')) {
                shakaPlayer = new shaka.Player(video);
                
                // যদি ClearKey লাইসেন্স টোকেন থাকে
                if (kid && key) {
                    shakaPlayer.configure({
                        drm: {
                            clearKeys: {
                                [kid]: key
                            }
                        }
                    });
                }
                
                shakaPlayer.load(url).then(() => {
                    video.muted = true; video.volume = 1.0;
                    video.play().then(handleMuteBypass);
                }).catch(e => console.error("Shaka DRM Engine Error:", e));

            } 
            // ২. যদি সাধারণ HLS (.m3u8) স্ট্রিম হয়
            else {
                hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.muted = true; video.volume = 1.0;
                    video.play().then(handleMuteBypass).catch(err => console.log("HLS Engine Reset Skip:", err));
                });
            }
        }

        // 🔊 ব্রাউজার অটোপ্লে পলিসি বাইপাস মেকানিজম
        function handleMuteBypass() {
            const unscrapeAudioLock = () => {
                video.muted = false;
                video.volume = 1.0;
                document.removeEventListener('click', unscrapeAudioLock);
                document.removeEventListener('touchend', unscrapeAudioLock);
            };
            document.addEventListener('click', unscrapeAudioLock);
            document.addEventListener('touchend', unscrapeAudioLock);
        }

        function reloadCurrentStream() {
            if (currentActiveUrl) {
                const activeEl = document.querySelector('.channel-card.active');
                // বর্তমান সেশন অনুসারী প্যারামিটার পুনরায় ইনজেক্ট করা হবে
                const currentCh = fifaChannels.find(c => c.url === currentActiveUrl) || {};
                switchStandardChannel(currentActiveUrl, document.getElementById('activeTitle').innerText, document.getElementById('activeLogo').src, activeEl, currentChannelType, currentCh.kid, currentCh.key);
            }
        }

        function handleRedirectChannel(targetUrl) {
            if (!video.paused) video.pause(); 
            window.open(targetUrl, '_blank');
        }

        function togglePanelTab(tabName, buttonElement) {
            document.querySelectorAll('.tab-trigger').forEach(t => t.classList.remove('active'));
            buttonElement.classList.add('active');

            document.getElementById('fifaTabPanel').classList.add('panel-grid-hidden');
            document.getElementById('sportsTabPanel').classList.add('panel-grid-hidden');
            document.getElementById('banglaTabPanel').classList.add('panel-grid-hidden');

            if (tabName === 'fifa') {
                document.getElementById('fifaTabPanel').classList.remove('panel-grid-hidden');
            } else if (tabName === 'sports') {
                document.getElementById('sportsTabPanel').classList.remove('panel-grid-hidden');
            } else if (tabName === 'bangla') {
                document.getElementById('banglaTabPanel').classList.remove('panel-grid-hidden');
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            shaka.polyfil.installAll(); // শাকা প্লেয়ার ড্রিম মেমোরি ইনিশিয়ালাইজেশন
            renderFifaSection();
            renderSportsSection();
            renderBanglaSection();
            
            // ডিফল্টভাবে ১ম রানিং বেইন স্পোর্টস চ্যানেলটি অটোস্টার্ট হবে
            setTimeout(() => {
                const defaultCard = document.querySelectorAll('#fifaTabPanel .channel-card')[1]; 
                switchStandardChannel('https://1nyaler.streamhostingcdn.top/stream/23/index.m3u8', 'Bein Sports 1', 'https://i.ibb.co.com/S7tZS6cg/Bein-Sports-1-Direct.png', defaultCard, 'hls');
            }, 300);
        });
    </script>
</body>
</html>
