            { "name": "HD SERVER ENG (Alt)", "logo": "https://fwatch.tv/assets/logo.webp", "url": "https://edgestreams.pro/hls/24SDAZFcsqnj24.m3u8?", "group": "HD", "tab": "premium" }, 
            { "name": "HD SERVER AR (Alt)", "logo": "https://fwatch.tv/assets/logo.webp", "url": "https://mainstreams.pro/hls/eJmauBDCIf.m3u8?", "group": "HD", "tab": "premium" }
        ];

        const video = document.getElementById('player');
        let hls = null;
        let dashPlayer = null;
        let currentActiveUrl = ''; 
        let savedCurrentChannelData = null;

        const plyr = new Plyr(video, { 
            autoplay: true, 
            controls: ['play-large', 'play', 'progress', 'current-time', 'volume', 'pip', 'fullscreen'] 
        });

        const overlay = document.getElementById('player-overlay');
        overlay.addEventListener('click', (e) => {
            e.stopPropagation();
            if(video.muted) {
                video.muted = false;
                video.volume = 1.0;
            }

            const controls = document.querySelector('.plyr__controls');
            if (controls) {
                const isControlsVisible = controls.style.opacity === '1' || 
                                          window.getComputedStyle(controls).visibility === 'visible' ||
                                          controls.classList.contains('plyr__controls--visible');
                
                if (isControlsVisible) {
                    if (video.paused) video.play();
                    else video.pause();
                } else {
                    plyr.toggleControls(true);
                }
            }
        });

        function renderLists() {
            const sportsPanel = document.getElementById("sportsTabPanel");
            const premiumPanel = document.getElementById("premiumTabPanel");
            
            sportsPanel.innerHTML = "";
            premiumPanel.innerHTML = "";

            allChannels.forEach((ch, idx) => {
                const card = document.createElement("div");
                card.className = "channel-card";
                card.setAttribute("data-url", ch.url);

                card.onclick = function() {
                    switchStandardChannel(ch, this);
                };

                card.innerHTML = `
                    <img src="${ch.logo}" class="logo-img" alt="${ch.name}" onerror="this.src='https://upload.wikimedia.org/wikipedia/en/thumb/1/17/2026_FIFA_World_Cup_emblem.svg/250px-2026_FIFA_World_Cup_emblem.svg.png'">
                    <div class="card-info-box">
                        <div class="card-name">${ch.name}</div>
                        <div class="card-group">${ch.group}</div>
                    </div>
                `;

                if(ch.tab === "sports") {
                    sportsPanel.appendChild(card);
                } else {
                    premiumPanel.appendChild(card);
                }
            });
        }

        function switchStandardChannel(channelObj, el) {
            savedCurrentChannelData = channelObj;
            currentActiveUrl = channelObj.url; 
            
            document.querySelectorAll('.channel-card').forEach(c => c.classList.remove('active'));
            if(el) el.classList.add('active');
            
            document.getElementById('activeTitle').innerText = channelObj.name;
            const activeLogo = document.getElementById('activeLogo');
            if (channelObj.logo) {
                activeLogo.src = channelObj.logo; activeLogo.style.display = 'inline-block';
            } else {
                activeLogo.style.display = 'none';
            }
            
            if (hls) { hls.destroy(); hls = null; }
            if (dashPlayer) { dashPlayer.reset(); dashPlayer = null; }

            // MPEG-DASH (.mpd) অথবা DRM প্রোটেকশন হ্যান্ডলিং মেকানিজম
            if (channelObj.type === 'dash' || channelObj.url.includes('.mpd')) {
                dashPlayer = dashjs.MediaPlayer().create();
                
                if (channelObj.kid && channelObj.key) {
                    dashPlayer.setProtectionData({
                        "org.w3.clearkey": {
                            "clearkeys": { [channelObj.kid]: channelObj.key }
                        }
                    });
                }
                
                dashPlayer.initialize(video, channelObj.url, true);
                dashPlayer.on(dashjs.MediaPlayer.events.STREAM_INITIALIZED, function() {
                    video.muted = false;
                    video.volume = 1.0;
                });
            } else {
                if (Hls.isSupported()) {
                    hls = new Hls();
                    hls.loadSource(channelObj.url);
                    hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, function() {
                        video.muted = false; 
                        video.volume = 1.0;
                        video.play().catch(() => {
                            video.muted = true;
                            video.play().then(handleMuteBypass);
                        });
                    });
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = channelObj.url;
                    video.play();
                }
            }
        }

        function handleMuteBypass() {
            const unscrapeAudioLock = () => {
                video.muted = false;
                video.volume = 1.0;
                document.removeEventListener('click', unscrapeAudioLock);
                document.removeEventListener('touchend', unscrapeAudioLock);
            };
            document.addEventListener('click', unscrapeAudioLock);
            document.addEventListener('touchend', unscrapeAudioLock);
        }

        function reloadCurrentStream() {
            if (savedCurrentChannelData) {
                const activeCard = document.querySelector(`.channel-card.active`);
                switchStandardChannel(savedCurrentChannelData, activeCard);
            }
        }

        function togglePanelTab(tabName, buttonElement) {
            document.querySelectorAll('.tab-trigger').forEach(t => t.classList.remove('active'));
            buttonElement.classList.add('active');

            document.getElementById('sportsTabPanel').classList.add('panel-grid-hidden');
            document.getElementById('premiumTabPanel').classList.add('panel-grid-hidden');

            if (tabName === 'sports') {
                document.getElementById('sportsTabPanel').classList.remove('panel-grid-hidden');
            } else if (tabName === 'premium') {
                document.getElementById('premiumTabPanel').classList.remove('panel-grid-hidden');
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderLists();
            
            setTimeout(() => {
                const defaultCard = document.querySelectorAll('#sportsTabPanel .channel-card')[0]; 
                if (defaultCard) {
                    switchStandardChannel(allChannels[0], defaultCard);
                }
            }, 400);
        });
    </script>
</body>
</html>
