<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Zion Sports — Premium Cinema OTT</title>
    <base href="https://fifalive.click/">

    <!-- Social Meta Engine -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Zion Sports — Ultimate OTT Edition">
    <meta property="og:description" content="Stream live global sports in ultimate cinematic fidelity.">
    <meta property="og:image" content="https://i.ibb.co.com/ymJhZWxG/1000075445-clean.png">

    <!-- Stylesheets & Fonts -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --neon-purple: #a855f7;
            --neon-cyan: #00f2fe;
            --neon-glow-purple: rgba(168, 85, 247, 0.4);
            --neon-glow-cyan: rgba(0, 242, 254, 0.3);
            --bg-master: #030008;
            --glass-card: rgba(18, 12, 38, 0.7);
            --glass-border: rgba(168, 85, 247, 0.18);
        }

        body { 
            background: var(--bg-master) !important;
            color: #f8fafc !important; 
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh; 
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            letter-spacing: -0.3px;
        }

        /* 🌌 ডাইনামিক লাইভ অ্যাম্বিয়েন্ট ব্যাকগ্রাউন্ড ইফেক্ট */
        .ambient-bg {
            position: fixed;
            top: -20%; left: -20%; width: 140%; height: 140%;
            background: radial-gradient(circle at 20% 30%, rgba(168, 85, 247, 0.15) 0%, transparent 40%),
                        radial-gradient(circle at 80% 70%, rgba(0, 242, 254, 0.12) 0%, transparent 45%);
            z-index: -1;
            pointer-events: none;
            filter: blur(60px);
        }

        /* 👑 লাক্সারি গ্লাসমরফিক নেভিগেশন বার */
        .ott-nav { 
            background: rgba(3, 0, 8, 0.75) !important; 
            backdrop-filter: blur(30px) saturate(180%); 
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            height: 65px; 
            display: flex; 
            align-items: center; 
            padding: 0 24px; 
            border-bottom: 1px solid rgba(255, 255, 255, 0.06); 
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 2100;
        }

        .brand-logo {
            font-weight: 800;
            font-size: 20px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ffffff 10%, var(--neon-purple) 60%, var(--neon-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo i {
            font-size: 24px;
            background: linear-gradient(135deg, var(--neon-purple), var(--neon-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px var(--neon-glow-purple));
        }

        /* 📺 ফুল-স্ক্রিন ফিট এবং নো-ব্ল্যাক-বার মাস্টার আর্কিটেকচার */
        .theater-screen-sticky-wrapper {
            position: -webkit-sticky;
            position: sticky;
            top: 0;
            z-index: 2050;
            background: #000;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.95);
        }
        
        .theater-screen { 
            position: relative; 
            width: 100%; 
            aspect-ratio: 16 / 9; 
            overflow: hidden; 
            background: #000;
        }
        
        #plyr-wrapper { width: 100%; height: 100%; position: absolute; top:0; left:0; z-index: 1; }
        
        /* 🚨 আল্ট্রা-ফিট ইঞ্জিন: ডানে-বামে বা ওপরে-নিচে কোনো ফাঁকা কালো দাগ রাখবে না */
        video { 
            width: 100% !important; 
            height: 100% !important; 
            background: #000; 
            object-fit: cover !important; 
        }
        .plyr video { object-fit: cover !important; }

        .player-click-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: calc(100% - 60px);
            z-index: 2;
            pointer-events: auto;
            cursor: pointer;
        }

        .ott-dashboard { padding: 16px; position: relative; z-index: 10; }
        
        .stream-details { 
            background: var(--glass-card); 
            padding: 16px 20px; 
            border-radius: 18px; 
            border: 1px solid var(--glass-border); 
            display: flex; 
            align-items: center; 
            gap: 16px; 
            position: relative;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .active-logo-img { 
            width: 40px; 
            height: 44px; 
            object-fit: contain; 
            border-radius: 8px; 
            background: rgba(255,255,255,0.06); 
            padding: 4px; 
            border: 1px solid rgba(0, 242, 254, 0.3); 
        }
        
        .badge-live { 
            background: linear-gradient(135deg, #ff0055, #bc003c); 
            color: #fff; 
            font-size: 11px; 
            padding: 4px 12px; 
            border-radius: 6px; 
            text-transform: uppercase; 
            font-weight: 800; 
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.45);
        }
        
        .btn-reload-stream {
            margin-left: auto;
            background: rgba(255, 255, 255, 0.05);
            color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 18px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-reload-stream:hover { 
            background: rgba(168, 85, 247, 0.2); 
            color: #ffffff;
            border-color: var(--neon-purple);
            box-shadow: 0 0 15px var(--neon-glow-purple);
        }

        /* 🚀 গ্লোবাল বেস্ট ফুলস্ক্রিন ও গাইরোস্কোপ অটো-রোটেটর বাটন */
        .btn-giant-fullscreen {
            width: 100%;
            background: linear-gradient(135deg, var(--neon-purple), #7c3aed);
            color: #fff;
            border: none;
            padding: 18px;
            font-size: 16px;
            font-weight: 800;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 16px;
            box-shadow: 0 8px 30px var(--neon-glow-purple);
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .btn-giant-fullscreen:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 35px rgba(168, 85, 247, 0.7);
            background: linear-gradient(135deg, #bd68ff, var(--neon-purple));
        }

        .horizontal-panel { 
            margin-top: 18px; 
            background: var(--glass-card); 
            padding: 18px; 
            border-radius: 20px; 
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }
        .iptv-grid-row { display: flex; flex-direction: column; gap: 14px; }

        /* ✨ থিয়েটার স্টাইল প্রিমিয়াম লিষ্ট কার্ড বাটন */
        .channel-card { 
            background: rgba(255, 255, 255, 0.02); 
            padding: 22px; 
            border-radius: 18px; 
            cursor: pointer; 
            display: flex; 
            flex-direction: row; 
            align-items: center; 
            justify-content: flex-start; 
            gap: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05); 
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); 
            width: 100%;
            position: relative;
        }
        .channel-card:hover { 
            border-color: var(--neon-cyan); 
            background: rgba(0, 242, 254, 0.06);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 242, 254, 0.1);
        }
        .channel-card.active { 
            border: 2px solid var(--neon-cyan); 
            background: rgba(0, 242, 254, 0.12); 
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.25); 
        }
        
        /* 🔴 লাইভ পালস অ্যানিমেশন সিগন্যাল */
        .channel-card.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 25%;
            height: 50%;
            width: 4px;
            background: var(--neon-cyan);
            border-radius: 0 4px 4px 0;
            box-shadow: 0 0 15px var(--neon-cyan);
        }
        
        .logo-img { 
            width: 48px; 
            height: 48px; 
            object-fit: contain; 
            border-radius: 12px; 
            padding: 4px; 
            background: rgba(255,255,255,0.05); 
            border: 1px solid rgba(255,255,255,0.08);
        }
        .card-info-box { display: flex; flex-direction: column; align-items: flex-start; gap: 5px; }
        .card-name { font-weight: 700; font-size: 16px; color: #f8fafc; text-transform: uppercase; letter-spacing: 0.5px; }
        .card-group { 
            font-size: 9.5px; 
            color: var(--neon-cyan); 
            text-transform: uppercase; 
            font-weight: 800; 
            background: rgba(0, 242, 254, 0.14); 
            padding: 4px 12px; 
            border-radius: 20px; 
            letter-spacing: 0.8px;
            box-shadow: inset 0 0 4px rgba(0, 242, 254, 0.2);
        }

        /* 🎨 সিনেমাটিক গ্লোয়িং প্লেয়ার কন্ট্রোল থিম */
        .plyr--video { 
            --plyr-color-main: var(--neon-purple); 
            --plyr-video-control-background-hover: rgba(168, 85, 247, 0.3);
            border-radius: inherit;
        }
        .plyr__control--overlaid {
            background: var(--neon-purple) !important;
            box-shadow: 0 0 35px var(--neon-glow-purple) !important;
        }
        .plyr__controls {
            background: linear-gradient(to top, rgba(3, 0, 8, 0.98), rgba(3, 0, 8, 0.5), rgba(0,0,0,0)) !important;
            padding: 30px 18px 18px !important;
        }
        .plyr__volume input[type=range] {
            max-width: 80px !important;
        }

        @media (min-width: 992px) {
            .ott-main-layout {
                display: grid;
                grid-template-columns: 64% 36%;
                gap: 30px;
                padding: 35px;
                align-items: start;
                max-width: 1450px;
                margin: 0 auto;
            }
            .left-column-wrapper {
                position: sticky;
                top: 35px;
                z-index: 10;
            }
            .theater-screen-sticky-wrapper {
                position: relative;
                border-radius: 24px;
                overflow: hidden;
                box-shadow: 0 25px 60px rgba(0,0,0,0.7);
            }
            .ott-dashboard { padding: 0 !important; }
            .horizontal-panel {
                max-height: calc(100vh - 210px);
                overflow-y: auto;
                padding-right: 8px;
            }
            .horizontal-panel::-webkit-scrollbar { width: 6px; }
            .horizontal-panel::-webkit-scrollbar-thumb { background: var(--neon-purple); border-radius: 10px; }
        }
    </style>
</head>
<body>

    <!-- লাইভ অ্যাম্বিয়েন্ট ব্যাকগ্রাউন্ড লেয়ার -->
    <div class="ambient-bg"></div>

    <!-- ব্র্যান্ড হেড লোগো -->
    <nav class="ott-nav">
        <div class="brand-logo">
            <i class="bi bi-play-circle-fill"></i> Zion Sports
        </div>
    </nav>

    <div class="ott-main-layout">
        
        <!-- বাম পাশের ভিডিও প্লেয়ার ও স্ট্রিমিং ড্যাশবোর্ড -->
        <div class="left-column-wrapper">
            <div class="theater-screen-sticky-wrapper" id="videoContainer">
                <div class="theater-screen">
                    <div id="plyr-wrapper">
                        <video id="player" playsinline controls autoplay></video>
                        <div class="player-click-overlay" id="player-overlay"></div>
                    </div>
                </div>
            </div>
            
            <div class="stream-details mt-3">
                <span class="badge-live">Live</span>
                <img id="activeLogo" src="" class="active-logo-img" alt="logo" onerror="this.style.display='none'">
                <h1 class="h6 m-0" id="activeTitle">Loading Luxury Engine...</h1>
                
                <button class="btn-reload-stream" onclick="reloadCurrentStream()"><i class="bi bi-arrow-clockwise"></i> Reload</button>
            </div>

            <!-- আল্ট্রা-রেসপন্সিভ এক্সপ্যান্ড অ্যান্ড রোটেট বাটন -->
            <button class="btn-giant-fullscreen" onclick="goPremiumFullscreen()">
                <i class="bi bi-fullscreen" style="display: inline-block; filter: drop-shadow(0 0 4px white);"></i> Expand Content & Rotate
            </button>
        </div>

        <!-- ডান পাশের সার্ভার ট্র্যাকিং প্যানেলসমূহ -->
        <div class="container-fluid ott-dashboard">
            <div class="horizontal-panel mt-0">
                <div id="fifaTabPanel" class="iptv-grid-row">
                    <!-- বাটন কোড এখানে জেনারেট হবে -->
                </div>
            </div>
            <div class="text-center mt-5 text-muted" style="font-size: 11px; opacity: 0.3; letter-spacing: 1px;">© 2026 Zion Sports • The Pinnacle of Streaming Experience</div>
        </div>

    </div>

    <!-- High-Performance Global Engines -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

    <script>
        // সচল আল্ট্রা প্রিমিয়াম ২ সার্ভারের হাই-স্পিড ডেটাবেজ
        const fifaChannels = [
            { "name": "FIFA Live (Server 1)", "url": "https://cdn011.viaplus.site/fox-usa.m3u8", "logo": "https://upload.wikimedia.org/wikipedia/en/thumb/1/17/2026_FIFA_World_Cup_emblem.svg/250px-2026_FIFA_World_Cup_emblem.svg.png" },
            { "name": "FIFA Live (Server 2)", "url": "https://cdn011.viaplus.site/telemundo-usa.m3u8", "logo": "https://upload.wikimedia.org/wikipedia/en/thumb/1/17/2026_FIFA_World_Cup_emblem.svg/250px-2026_FIFA_World_Cup_emblem.svg.png" }
        ];

        const video = document.getElementById('player');
        let hls = null;
        let currentActiveUrl = ''; 
        let savedCurrentChannelData = null;

        const plyr = new Plyr(video, { 
            autoplay: true, 
            controls: ['play-large', 'play', 'progress', 'current-time', 'volume', 'mute', 'pip', 'fullscreen'] 
        });

        const overlay = document.getElementById('player-overlay');
        overlay.addEventListener('click', (e) => {
            e.stopPropagation();
            if(video.muted) {
                video.muted = false;
                video.volume = 1.0;
            }

            const controls = document.querySelector('.plyr__controls');
            if (controls) {
                const isControlsVisible = controls.style.opacity === '1' || 
                                          window.getComputedStyle(controls).visibility === 'visible' ||
                                          controls.classList.contains('plyr__controls--visible');
                
                if (isControlsVisible) {
                    if (video.paused) video.play();
                    else video.pause();
                } else {
                    plyr.toggleControls(true);
                }
            }
        });

        function renderLists() {
            const panel = document.getElementById("fifaTabPanel");
            if (!panel) return;
            panel.innerHTML = "";

            fifaChannels.forEach((ch, idx) => {
                const card = document.createElement("div");
                card.className = "channel-card";

                card.onclick = (function(index) {
                    return function() {
                        switchStandardChannel(fifaChannels[index], this);
                    };
                })(idx);

                card.innerHTML = `
                    <img src="${ch.logo}" class="logo-img" alt="${ch.name}">
                    <div class="card-info-box">
                        <div class="card-name">${ch.name}</div>
                        <div class="card-group">ULTRA HD SERVER</div>
                    </div>
                `;
                panel.appendChild(card);
            });
        }

        function switchStandardChannel(channelObj, el) {
            savedCurrentChannelData = channelObj;
            currentActiveUrl = channelObj.url; 
            
            document.querySelectorAll('.channel-card').forEach(c => c.classList.remove('active'));
            if(el) el.classList.add('active');
            
            document.getElementById('activeTitle').innerText = channelObj.name;
            const activeLogo = document.getElementById('activeLogo');
            activeLogo.src = channelObj.logo; 
            activeLogo.style.display = 'inline-block';
            
            if (hls) { hls.destroy(); hls = null; }

            if (Hls.isSupported()) {
                // গ্লোবাল ওটিটি গ্রেড বাফারিং প্যারামিটার কনফিগারেশন
                hls = new Hls({
                    maxBufferLength: 40,
                    maxMaxBufferLength: 80,
                    enableWorker: true,
                    liveSyncDurationCount: 3,
                    liveMaxLatencyDurationCount: 10
                });
                hls.loadSource(channelObj.url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.muted = false; 
                    video.volume = 1.0;
                    video.play().catch(() => {
                        video.muted = true;
                        video.play().then(handleMuteBypass);
                    });
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = channelObj.url;
                video.play();
            }
        }

        function handleMuteBypass() {
            const unscrapeAudioLock = () => {
                video.muted = false;
                video.volume = 1.0;
                document.removeEventListener('click', unscrapeAudioLock);
                document.removeEventListener('touchend', unscrapeAudioLock);
            };
            document.addEventListener('click', unscrapeAudioLock);
            document.addEventListener('touchend', unscrapeAudioLock);
        }

        function reloadCurrentStream() {
            if (savedCurrentChannelData) {
                switchStandardChannel(savedCurrentChannelData, document.querySelector('.channel-card.active'));
            }
        }

        // 🔄 সুপার সায়ান মাল্টি-রোটেশন ও হার্ডওয়্যার এক্সপ্যান্ড ইঞ্জিন
        function goPremiumFullscreen() {
            const container = document.getElementById('videoContainer');
            if (!document.fullscreenElement) {
                if (container.requestFullscreen) {
                    container.requestFullscreen();
                } else if (container.webkitRequestFullscreen) {
                    container.webkitRequestFullscreen();
                } else if (video.webkitEnterFullscreen) {
                    video.webkitEnterFullscreen();
                }
                
                // গাইরো-লক ও আড়াআড়ি ওরিয়েন্টেশন একটিভেশন
                if (screen.orientation && screen.orientation.lock) {
                    screen.orientation.lock('landscape').catch(function(err) {
                        console.log("Orientation auto-handled natively.");
                    });
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderLists();
            
            setTimeout(() => {
                // ডিফল্ট সার্ভার হিসেবে ২ নম্বর চ্যানেলটি (Server 2) ফার্স্ট প্লে হবে কোনো বাফারিং ছাড়া
                const defaultCard = document.querySelectorAll('#fifaTabPanel .channel-card')[1]; 
                if (defaultCard) {
                    switchStandardChannel(fifaChannels[1], defaultCard);
                }
            }, 400);
        });
    </script>
</body>
</html>
