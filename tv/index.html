<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zion Sports — Ultimate OTT</title>
    <base href="https://fifalive.click/">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Zion Sports — Ultimate OTT">
    <meta property="og:description" content="Watch Live FIFA Premium smoothly on Zion Sports.">
    <meta property="og:image" content="https://i.ibb.co.com/ymJhZWxG/1000075445-clean.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <style>
        :root {
            --purple-primary: #7c3aed;
            --purple-glow: rgba(124, 58, 237, 0.4);
            --purple-bg-dark: #090514;
            --panel-bg: rgba(22, 14, 45, 0.6);
            --card-border: rgba(124, 58, 237, 0.15);
        }

        body { 
            background-color: var(--purple-bg-dark) !important; 
            color: #f1f5f9 !important; 
            font-family: sans-serif; 
            min-height: 100vh; 
            margin: 0;
            padding: 0;
        }

        .ott-nav { 
            background: rgba(9, 5, 20, 0.85) !important; 
            backdrop-filter: blur(20px); 
            height: 55px; 
            display: flex; 
            align-items: center; 
            padding: 0 15px; 
            border-bottom: 1px solid rgba(124, 58, 237, 0.2); 
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .theater-screen-sticky-wrapper {
            position: -webkit-sticky;
            position: sticky;
            top: 0;
            z-index: 2050;
            background: #000;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9);
        }
        
        .theater-screen { 
            position: relative; 
            width: 100%; 
            aspect-ratio: 16 / 9; 
            overflow: hidden; 
        }
        
        #plyr-wrapper { width: 100%; height: 100%; position: absolute; top:0; left:0; z-index: 1; }
        video { width: 100%; height: 100%; background: #000; object-fit: contain !important; }
        .plyr { width: 100%; height: 100%; }

        .player-click-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: calc(100% - 50px);
            z-index: 2;
            pointer-events: auto;
            cursor: pointer;
        }

        .ott-dashboard { padding: 12px; }
        .stream-details { background: var(--panel-bg); padding: 10px 14px; border-radius: 12px; border: 1px solid rgba(124, 58, 237, 0.15); display: flex; align-items: center; gap: 12px; position: relative; }
        .active-logo-img { width: 30px; height: 34px; object-fit: contain; border-radius: 6px; background: rgba(255,255,255,0.08); padding: 2px; border: 1px solid rgba(124, 58, 237, 0.3); }
        
        .badge-live { background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; font-size: 9px; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; font-weight: bold; }
        .horizontal-panel { margin-top: 12px; background: var(--panel-bg); padding: 12px; border-radius: 14px; border: 1px solid rgba(124, 58, 237, 0.1); }
        
        .btn-reload-stream {
            margin-left: auto;
            background: rgba(124, 58, 237, 0.1);
            color: #c084fc;
            border: 1px solid rgba(124, 58, 237, 0.4);
            padding: 4px 10px;
            font-size: 10px;
            font-weight: 700;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }

        .iptv-grid-row { display: flex; flex-direction: column; gap: 8px; }

        .channel-card { 
            background: rgba(255,255,255,0.02); 
            padding: 12px 14px; 
            border-radius: 10px; 
            cursor: pointer; 
            display: flex; 
            flex-direction: row; 
            align-items: center; 
            justify-content: flex-start; 
            gap: 14px;
            border: 1px solid var(--card-border); 
            transition: all 0.2s ease; 
            width: 100%;
        }
        .channel-card:hover { border-color: rgba(124, 58, 237, 0.3); background: rgba(124, 58, 237, 0.02); }
        .channel-card.active { border: 1.5px solid var(--purple-primary); background: rgba(124, 58, 237, 0.12); box-shadow: 0 0 15px rgba(124, 58, 237, 0.15); }
        
        .logo-img { width: 36px; height: 36px; object-fit: contain; border-radius: 6px; padding: 2px; background: rgba(255,255,255,0.04); }
        .card-info-box { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
        .card-name { font-weight: 600; font-size: 13px; color: #cbd5e1; text-transform: uppercase; letter-spacing: 0.3px; }
        .card-group { font-size: 9px; color: #7c7299; text-transform: uppercase; font-weight: 700; }

        .plyr--video { --plyr-color-main: var(--purple-primary); }

        @media (min-width: 992px) {
            .ott-main-layout {
                display: grid;
                grid-template-columns: 60% 40%;
                gap: 20px;
                padding: 20px;
                align-items: start;
            }
            .left-column-wrapper {
                position: sticky;
                top: 20px;
                z-index: 10;
            }
            .theater-screen-sticky-wrapper {
                position: relative;
                border-radius: 12px;
                overflow: hidden;
                box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            }
            .ott-dashboard { padding: 0 !important; }
            .horizontal-panel {
                max-height: calc(100vh - 100px);
                overflow-y: auto;
                padding-right: 5px;
            }
            .horizontal-panel::-webkit-scrollbar { width: 5px; }
            .horizontal-panel::-webkit-scrollbar-thumb { background: var(--purple-primary); border-radius: 10px; }
        }
    </style>
</head>
<body>

    <nav class="ott-nav"><div class="text-white fw-bold"><i class="bi bi-play-circle text-purple-primary" style="color: var(--purple-primary);"></i> ZION SPORTS</div></nav>

    <div class="ott-main-layout">
        
        <div class="left-column-wrapper">
            <div class="theater-screen-sticky-wrapper">
                <div class="theater-screen">
                    <div id="plyr-wrapper">
                        <video id="player" playsinline controls autoplay></video>
                        <div class="player-click-overlay" id="player-overlay"></div>
                    </div>
                </div>
            </div>
            
            <div class="stream-details mt-3">
                <span class="badge-live">Live</span>
                <img id="activeLogo" src="" class="active-logo-img" alt="logo" onerror="this.style.display='none'">
                <h1 class="h6 m-0" id="activeTitle">Loading Server...</h1>
                
                <button class="btn-reload-stream" onclick="reloadCurrentStream()"><i class="bi bi-arrow-clockwise"></i> Reload</button>
            </div>
        </div>

        <div class="container-fluid ott-dashboard">
            <div class="horizontal-panel mt-0">
                <div id="fifaTabPanel" class="iptv-grid-row">
                    </div>
            </div>
            <div class="text-center mt-5 text-muted" style="font-size: 10px; opacity: 0.2;">© 2026 Zion Sports • Powered by GitHub Pages</div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

    <script>
        // 📥 শুধুমাত্র সচল ২ এবং ৩ নম্বর সার্ভার দুটি ফিল্টার করা হলো
        const fifaChannels = [
            { "name": "FIFA Live (Server 1)", "url": "https://cdn011.viaplus.site/fox-usa.m3u8", "logo": "https://upload.wikimedia.org/wikipedia/en/thumb/1/17/2026_FIFA_World_Cup_emblem.svg/250px-2026_FIFA_World_Cup_emblem.svg.png" },
            { "name": "FIFA Live (Server 2)", "url": "https://cdn011.viaplus.site/telemundo-usa.m3u8", "logo": "https://upload.wikimedia.org/wikipedia/en/thumb/1/17/2026_FIFA_World_Cup_emblem.svg/250px-2026_FIFA_World_Cup_emblem.svg.png" }
        ];

        const video = document.getElementById('player');
        let hls = null;
        let currentActiveUrl = ''; 
        let savedCurrentChannelData = null;

        const plyr = new Plyr(video, { 
            autoplay: true, 
            controls: ['play-large', 'play', 'progress', 'current-time', 'volume', 'pip', 'fullscreen'] 
        });

        const overlay = document.getElementById('player-overlay');
        overlay.addEventListener('click', (e) => {
            e.stopPropagation();
            if(video.muted) {
                video.muted = false;
                video.volume = 1.0;
            }

            const controls = document.querySelector('.plyr__controls');
            if (controls) {
                const isControlsVisible = controls.style.opacity === '1' || 
                                          window.getComputedStyle(controls).visibility === 'visible' ||
                                          controls.classList.contains('plyr__controls--visible');
                
                if (isControlsVisible) {
                    if (video.paused) video.play();
                    else video.pause();
                } else {
                    plyr.toggleControls(true);
                }
            }
        });

        function renderLists() {
            const panel = document.getElementById("fifaTabPanel");
            if (!panel) return;
            panel.innerHTML = "";

            fifaChannels.forEach((ch, idx) => {
                const card = document.createElement("div");
                card.className = "channel-card";

                card.onclick = (function(index) {
                    return function() {
                        switchStandardChannel(fifaChannels[index], this);
                    };
                })(idx);

                card.innerHTML = `
                    <img src="${ch.logo}" class="logo-img" alt="${ch.name}">
                    <div class="card-info-box">
                        <div class="card-name">${ch.name}</div>
                        <div class="card-group">LIVE STREAM</div>
                    </div>
                `;
                panel.appendChild(card);
            });
        }

        function switchStandardChannel(channelObj, el) {
            savedCurrentChannelData = channelObj;
            currentActiveUrl = channelObj.url; 
            
            document.querySelectorAll('.channel-card').forEach(c => c.classList.remove('active'));
            if(el) el.classList.add('active');
            
            document.getElementById('activeTitle').innerText = channelObj.name;
            const activeLogo = document.getElementById('activeLogo');
            activeLogo.src = channelObj.logo; 
            activeLogo.style.display = 'inline-block';
            
            if (hls) { hls.destroy(); hls = null; }

            if (Hls.isSupported()) {
                hls = new Hls();
                hls.loadSource(channelObj.url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.muted = false; 
                    video.volume = 1.0;
                    video.play().catch(() => {
                        video.muted = true;
                        video.play().then(handleMuteBypass);
                    });
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = channelObj.url;
                video.play();
            }
        }

        function handleMuteBypass() {
            const unscrapeAudioLock = () => {
                video.muted = false;
                video.volume = 1.0;
                document.removeEventListener('click', unscrapeAudioLock);
                document.removeEventListener('touchend', unscrapeAudioLock);
            };
            document.addEventListener('click', unscrapeAudioLock);
            document.addEventListener('touchend', unscrapeAudioLock);
        }

        function reloadCurrentStream() {
            if (savedCurrentChannelData) {
                switchStandardChannel(savedCurrentChannelData, document.querySelector('.channel-card.active'));
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderLists();
            
            setTimeout(() => {
                const defaultCard = document.querySelectorAll('#fifaTabPanel .channel-card')[0]; 
                if (defaultCard) {
                    switchStandardChannel(fifaChannels[0], defaultCard);
                }
            }, 400);
        });
    </script>
</body>
</html>
