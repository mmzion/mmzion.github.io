<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Zion Sports — YouTube Premium Edition</title>
    <base href="https://fifalive.click/">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Zion Sports — Ultimate OTT">
    <meta property="og:description" content="Watch Live Premium Streams smoothly on Zion Sports YouTube Clone.">
    <meta property="og:image" content="https://i.ibb.co.com/ymJhZWxG/1000075445-clean.png">

    <!-- Frameworks & Fonts -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --yt-black: #0f0f0f;
            --yt-paper: #212121;
            --yt-red: #ff0000;
            --yt-text-main: #f1f1f1;
            --yt-text-sub: #aaa;
        }

        body { 
            background-color: var(--yt-black) !important; 
            color: var(--yt-text-main) !important; 
            font-family: 'Roboto', sans-serif;
            min-height: 100vh; 
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* 🔴 ইউটিউব স্টাইল হেডার */
        .ott-nav { 
            background: var(--yt-black); 
            height: 56px; 
            display: flex; 
            align-items: center; 
            padding: 0 16px; 
            position: sticky;
            top: 0;
            z-index: 2100;
        }

        .brand-logo {
            font-weight: 700;
            font-size: 19px;
            letter-spacing: -0.5px;
            color: var(--yt-text-main);
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }

        .brand-logo i {
            color: var(--yt-red);
            font-size: 24px;
        }

        .brand-logo span {
            font-size: 11px;
            color: var(--yt-text-sub);
            align-self: flex-start;
            margin-top: 3px;
            margin-left: 2px;
            font-weight: 400;
        }

        /* 📺 ইউটিউব মেইন লেআউট ফিক্স */
        .theater-screen-sticky-wrapper {
            position: -webkit-sticky;
            position: sticky;
            top: 0;
            z-index: 2050;
            background: #000;
            width: 100%;
        }
        
        .theater-screen { 
            position: relative; 
            width: 100%; 
            aspect-ratio: 16 / 9; 
            overflow: hidden; 
        }
        
        #plyr-wrapper { width: 100%; height: 100%; position: absolute; top:0; left:0; z-index: 1; }
        
        video { 
            width: 100% !important; 
            height: 100% !important; 
            background: #000; 
            object-fit: cover !important; 
        }
        .plyr video { object-fit: cover !important; }

        .player-click-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: calc(100% - 48px);
            z-index: 2;
            pointer-events: auto;
            cursor: pointer;
        }

        .ott-dashboard { padding: 16px; }

        /* 📝 ভিডিও ইনফো এরিয়া (ইউটিউব স্টাইল) */
        .video-meta-block {
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .video-title {
            font-size: 18px;
            font-weight: 700;
            line-height: 24px;
            margin-bottom: 8px;
            color: var(--yt-text-main);
        }

        .channel-info-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 12px;
        }

        .channel-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #282828;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: var(--yt-red);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .channel-name-box {
            display: flex;
            flex-direction: column;
        }

        .channel-name {
            font-weight: 500;
            font-size: 14px;
            color: var(--yt-text-main);
        }

        .channel-subs {
            font-size: 12px;
            color: var(--yt-text-sub);
        }

        .btn-yt-subscribe {
            background-color: #f1f1f1;
            color: #0f0f0f;
            border: none;
            padding: 8px 16px;
            border-radius: 18px;
            font-size: 13px;
            font-weight: 500;
            margin-left: auto;
            cursor: pointer;
        }

        /* 🔁 সাজেস্টেড ভিডিও লিস্ট (ইউটিউব রাইট প্যানেল ক্লোন) */
        .horizontal-panel { margin-top: 16px; }
        .iptv-grid-row { display: flex; flex-direction: column; gap: 10px; }

        .channel-card { 
            display: flex; 
            flex-direction: row; 
            align-items: flex-start; 
            gap: 10px;
            cursor: pointer; 
            width: 100%;
            padding: 4px 0;
        }

        .thumb-wrapper {
            position: relative;
            width: 140px;
            aspect-ratio: 16 / 9;
            border-radius: 8px;
            overflow: hidden;
            background: #282828;
            flex-shrink: 0;
        }

        .thumb-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .duration-badge {
            position: absolute;
            bottom: 4px;
            right: 4px;
            background: rgba(0,0,0,0.8);
            color: #fff;
            font-size: 10px;
            padding: 1px 4px;
            border-radius: 2px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .duration-badge.live {
            background: var(--yt-red);
        }

        .card-info-box { 
            display: flex; 
            flex-direction: column; 
            align-items: flex-start; 
            gap: 2px;
            overflow: hidden;
        }

        .card-name { 
            font-weight: 500; 
            font-size: 14px; 
            color: var(--yt-text-main); 
            line-height: 18px;
            max-height: 36px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .card-group { 
            font-size: 12px; 
            color: var(--yt-text-sub); 
        }

        /* একটিভ ভিডিও ট্র্যাকিং বর্ডার বর্জন (হুবহু ইউটিউব ওয়াচিং ফিল) */
        .channel-card.active .card-name {
            color: #3ea6ff;
        }

        .plyr--video { --plyr-color-main: var(--yt-red); }

        /* 💻 ডেস্কটপ স্পেশাল গ্রিড আর্কিটেকচার */
        @media (min-width: 992px) {
            .ott-main-layout {
                display: grid;
                grid-template-columns: 1fr 360px;
                gap: 24px;
                padding: 24px;
                max-width: 1280px;
                margin: 0 auto;
            }
            .left-column-wrapper {
                position: relative;
            }
            .theater-screen-sticky-wrapper {
                position: relative;
                border-radius: 12px;
                overflow: hidden;
            }
            .ott-dashboard { padding: 0 !important; }
            .horizontal-panel { margin-top: 0px; }
            .thumb-wrapper { width: 168px; }
        }
    </style>
</head>
<body>

    <!-- হেডার বার -->
    <nav class="ott-nav">
        <a href="/" class="brand-logo">
            <i class="bi bi-youtube"></i> Zion Sports <span>BD</span>
        </a>
    </nav>

    <div class="ott-main-layout">
        
        <!-- বাম পাশের অংশ: প্লেয়ার এবং ভিডিও মেটাডাটা -->
        <div class="left-column-wrapper">
            <div class="theater-screen-sticky-wrapper" id="videoContainer">
                <div class="theater-screen">
                    <div id="plyr-wrapper">
                        <video id="player" playsinline controls autoplay></video>
                        <div class="player-click-overlay" id="player-overlay"></div>
                    </div>
                </div>
            </div>
            
            <div class="video-meta-block container-fluid">
                <h1 class="video-title" id="activeTitle">Loading Server...</h1>
                <div class="channel-info-bar">
                    <div class="channel-avatar">Z</div>
                    <div class="channel-name-box">
                        <div class="channel-name">Zion Sports Premium</div>
                        <div class="channel-subs">1.45M subscribers</div>
                    </div>
                    <button class="btn-yt-subscribe" onclick="reloadCurrentStream()"><i class="bi bi-arrow-clockwise"></i> Reload</button>
                </div>
            </div>
        </div>

        <!-- ডান পাশের অংশ: ইউটিউব স্টাইল ভিডিওর সাজেস্টেড লিস্ট -->
        <div class="container-fluid ott-dashboard">
            <div class="horizontal-panel">
                <div id="fifaTabPanel" class="iptv-grid-row">
                    <!-- ভিডিও লুপ কোড এখানে ইনজেক্ট হবে -->
                </div>
            </div>
        </div>

    </div>

    <!-- high-fidelity engines -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

    <script>
        const fifaChannels = [
            { "name": "FIFA Live (Server 1) - Live Match Stream 1080p FHD", "url": "https://cdn011.viaplus.site/fox-usa.m3u8", "logo": "https://upload.wikimedia.org/wikipedia/en/thumb/1/17/2026_FIFA_World_Cup_emblem.svg/250px-2026_FIFA_World_Cup_emblem.svg.png", "tag": "FOX" },
            { "name": "FIFA Live (Server 2) - Telemundo Premium Broadcasting", "url": "https://cdn011.viaplus.site/telemundo-usa.m3u8", "logo": "https://upload.wikimedia.org/wikipedia/en/thumb/1/17/2026_FIFA_World_Cup_emblem.svg/250px-2026_FIFA_World_Cup_emblem.svg.png", "tag": "LIVE" }
        ];

        const video = document.getElementById('player');
        let hls = null;
        let currentActiveUrl = ''; 
        let savedCurrentChannelData = null;

        const plyr = new Plyr(video, { 
            autoplay: true, 
            controls: ['play-large', 'play', 'progress', 'current-time', 'volume', 'mute', 'pip', 'fullscreen'] 
        });

        const overlay = document.getElementById('player-overlay');
        overlay.addEventListener('click', (e) => {
            e.stopPropagation();
            if(video.muted) {
                video.muted = false;
                video.volume = 1.0;
            }

            const controls = document.querySelector('.plyr__controls');
            if (controls) {
                const isControlsVisible = controls.style.opacity === '1' || 
                                          window.getComputedStyle(controls).visibility === 'visible' ||
                                          controls.classList.contains('plyr__controls--visible');
                
                if (isControlsVisible) {
                    if (video.paused) video.play();
                    else video.pause();
                } else {
                    plyr.toggleControls(true);
                }
            }
        });

        function renderLists() {
            const panel = document.getElementById("fifaTabPanel");
            if (!panel) return;
            panel.innerHTML = "";

            fifaChannels.forEach((ch, idx) => {
                const card = document.createElement("div");
                card.className = "channel-card";

                card.onclick = (function(index) {
                    return function() {
                        switchStandardChannel(fifaChannels[index], this);
                    };
                })(idx);

                card.innerHTML = `
                    <div class="thumb-wrapper">
                        <img src="${ch.logo}" alt="Thumbnail">
                        <span class="duration-badge ${ch.tag === 'LIVE' ? 'live' : ''}">${ch.tag}</span>
                    </div>
                    <div class="card-info-box">
                        <div class="card-name">${ch.name}</div>
                        <div class="card-group">Zion Sports • 45K views</div>
                    </div>
                `;
                panel.appendChild(card);
            });
        }

        function switchStandardChannel(channelObj, el) {
            savedCurrentChannelData = channelObj;
            currentActiveUrl = channelObj.url; 
            
            document.querySelectorAll('.channel-card').forEach(c => c.classList.remove('active'));
            if(el) el.classList.add('active');
            
            document.getElementById('activeTitle').innerText = channelObj.name;
            
            if (hls) { hls.destroy(); hls = null; }

            if (Hls.isSupported()) {
                hls = new Hls({
                    maxBufferLength: 30,
                    enableWorker: true
                });
                hls.loadSource(channelObj.url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.muted = false; 
                    video.volume = 1.0;
                    video.play().catch(() => {
                        video.muted = true;
                        video.play().then(handleMuteBypass);
                    });
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = channelObj.url;
                video.play();
            }
        }

        function handleMuteBypass() {
            const unscrapeAudioLock = () => {
                video.muted = false;
                video.volume = 1.0;
                document.removeEventListener('click', unscrapeAudioLock);
                document.removeEventListener('touchend', unscrapeAudioLock);
            };
            document.addEventListener('click', unscrapeAudioLock);
            document.addEventListener('touchend', unscrapeAudioLock);
        }

        function reloadCurrentStream() {
            if (savedCurrentChannelData) {
                switchStandardChannel(savedCurrentChannelData, document.querySelector('.channel-card.active'));
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderLists();
            
            setTimeout(() => {
                // ডিফল্ট হিসেবে ২ নম্বর চ্যানেলটি (Server 2) ফার্স্ট প্লে হবে
                const defaultCard = document.querySelectorAll('#fifaTabPanel .channel-card')[1]; 
                if (defaultCard) {
                    switchStandardChannel(fifaChannels[1], defaultCard);
                }
            }, 400);
        });
    </script>
</body>
</html>
