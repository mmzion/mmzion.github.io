    <style>
        :root {
            --yt-black: #0f0f0f;
            --yt-paper: #212121;
            --yt-red: #f00;
            --yt-text-main: #f1f1f1;
            --yt-text-sub: #aaa;
        }

        body { 
            background-color: var(--yt-black) !important; 
            color: var(--yt-text-main) !important; 
            font-family: 'Roboto', sans-serif;
            min-height: 100vh; 
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* 🔴 ক্লিন হেডার বার */
        .ott-nav { 
            background: var(--yt-black); 
            height: 56px; 
            display: flex; 
            align-items: center; 
            padding: 0 16px; 
            position: sticky;
            top: 0;
            z-index: 2100;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .brand-logo {
            font-weight: 700;
            font-size: 20px;
            letter-spacing: -0.5px;
            color: var(--yt-text-main);
            text-decoration: none;
            text-transform: uppercase;
        }

        .brand-logo span {
            font-size: 11px;
            color: var(--yt-red);
            margin-left: 4px;
            font-weight: 700;
        }

        /* 📺 প্লেয়ার আর্কিটেকচার */
        .theater-screen-sticky-wrapper {
            position: -webkit-sticky;
            position: sticky;
            top: 0;
            z-index: 2050;
            background: #000;
            width: 100%;
        }
        
        .theater-screen { 
            position: relative; 
            width: 100%; 
            aspect-ratio: 16 / 9; 
            overflow: hidden; 
        }
        
        #plyr-wrapper { width: 100%; height: 100%; position: absolute; top:0; left:0; z-index: 1; }
        
        video { 
            width: 100% !important; 
            height: 100% !important; 
            background: #000; 
            object-fit: cover !important; 
        }
        .plyr video { object-fit: cover !important; }

        .player-click-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: calc(100% - 48px);
            z-index: 2;
            pointer-events: auto;
            cursor: pointer;
        }

        .ott-dashboard { padding: 16px; }

        /* 📝 ভিডিও মেটাডাটা এরিয়া */
        .video-meta-block {
            padding: 14px 0;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .video-title {
            font-size: 18px;
            font-weight: 700;
            line-height: 24px;
            margin-bottom: 12px;
            color: var(--yt-text-main);
        }

        .channel-info-bar {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .channel-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #282828;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #fff;
            border: 1px solid rgba(255,255,255,0.1);
            font-size: 16px;
        }

        .channel-name-box {
            display: flex;
            flex-direction: column;
        }

        .channel-name {
            font-weight: 500;
            font-size: 15px;
            color: var(--yt-text-main);
        }

        .btn-yt-reload {
            background-color: rgba(255, 255, 255, 0.1);
            color: var(--yt-text-main);
            border: none;
            padding: 8px 16px;
            border-radius: 18px;
            font-size: 13px;
            font-weight: 500;
            margin-left: auto;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-yt-reload:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        /* 🔁 সাজেস্টেড ভিডিও লিস্ট */
        .horizontal-panel { margin-top: 16px; }
        .iptv-grid-row { display: flex; flex-direction: column; gap: 12px; }

        .channel-card { 
            display: flex; 
            flex-direction: row; 
            align-items: flex-start; 
            gap: 12px;
            cursor: pointer; 
            width: 100%;
            padding: 2px 0;
        }

        .thumb-wrapper {
            position: relative;
            width: 145px;
            aspect-ratio: 16 / 9;
            border-radius: 8px;
            overflow: hidden;
            background: #202020;
            flex-shrink: 0;
        }

        .thumb-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .duration-badge {
            position: absolute;
            bottom: 4px;
            right: 4px;
            background: rgba(0,0,0,0.8);
            color: #fff;
            font-size: 10px;
            padding: 1px 4px;
            border-radius: 2px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .duration-badge.live {
            background: var(--yt-red);
        }

        .card-info-box { 
            display: flex; 
            flex-direction: column; 
            align-items: flex-start; 
            gap: 2px;
            overflow: hidden;
        }

        .card-name { 
            font-weight: 500; 
            font-size: 14px; 
            color: var(--yt-text-main); 
            line-height: 18px;
            max-height: 36px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .card-group { 
            font-size: 12px; 
            color: var(--yt-text-sub); 
            margin-top: 2px;
        }

        .channel-card.active .card-name {
            color: #3ea6ff;
        }

        /* 🎯 ইউটিউব ওয়েব প্লেয়ার সিবি ক্লোন সিএসএস */
        .plyr--video { 
            --plyr-color-main: var(--yt-red); 
            --plyr-video-control-background-hover: transparent;
            --plyr-control-spacing: 8px;
            font-family: 'Roboto', sans-serif;
        }

        .plyr__controls {
            background: linear-gradient(to top, rgba(0, 0, 0, 0.85) 0%, rgba(0, 0, 0, 0.3) 60%, transparent 100%) !important;
            padding: 30px 14px 6px !important;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
        }

        .plyr__progress__container {
            width: 100% !important;
            flex: none !important;
            margin: 0 0 4px 0 !important;
            padding: 0 !important;
            order: -1; 
        }

        .plyr__progress input[type=range] {
            height: 4px !important;
            transition: height 0.1s ease;
            cursor: pointer;
        }

        .plyr__progress:hover input[type=range] {
            height: 6px !important;
        }

        .plyr__control {
            padding: 6px 10px !important;
            background: transparent !important;
            color: #fff !important;
            border-radius: 0 !important;
            transition: opacity 0.1s ease;
        }

        .plyr__control:hover {
            background: transparent !important;
            opacity: 0.9;
        }

        .plyr__control svg {
            width: 20px !important;
            height: 20px !important;
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5));
        }

        .plyr__control--overlaid {
            background: rgba(0, 0, 0, 0.6) !important;
            border-radius: 50% !important;
            width: 64px !important;
            height: 64px !important;
        }
        .plyr__control--overlaid svg {
            width: 30px !important;
            height: 30px !important;
            margin-left: 4px;
        }

        .plyr__time {
            font-size: 13px !important;
            padding: 0 6px !important;
            color: #e1e1e1 !important;
        }

        .plyr__volume {
            align-items: center;
            max-width: 85px !important;
        }

        .plyr__volume input[type=range] {
            height: 3px !important;
        }

        .plyr__menu, 
        .plyr__control[data-plyr='pip'], 
        .plyr__control[data-plyr='fullscreen'] {
            margin-left: auto;
        }
        
        .plyr__control[data-plyr='pip'] + .plyr__control[data-plyr='fullscreen'] {
            margin-left: 0 !important;
        }

        /* 💻 ডেক্সটপ লেআউট গ্রিড */
        @media (min-width: 992px) {
            .ott-main-layout {
                display: grid;
                grid-template-columns: 1fr 380px;
                gap: 24px;
                padding: 24px;
                max-width: 1280px;
                margin: 0 auto;
            }
            .left-column-wrapper {
                position: relative;
            }
            .theater-screen-sticky-wrapper {
                position: relative;
                border-radius: 12px;
                overflow: hidden;
            }
            .ott-dashboard { padding: 0 !important; }
            .horizontal-panel { margin-top: 0px; }
            .thumb-wrapper { width: 168px; }
        }
    </style>
</head>

            autoplay: true, 
            controls: ['play-large', 'play', 'progress', 'current-time', 'volume', 'mute', 'pip', 'fullscreen'] 
        });

        const overlay = document.getElementById('player-overlay');
        overlay.addEventListener('click', (e) => {
            e.stopPropagation();
            if(video.muted) {
                video.muted = false;
                video.volume = 1.0;
            }

            const controls = document.querySelector('.plyr__controls');
            if (controls) {
                const isControlsVisible = controls.style.opacity === '1' || 
                                          window.getComputedStyle(controls).visibility === 'visible' ||
                                          controls.classList.contains('plyr__controls--visible');
                
                if (isControlsVisible) {
                    if (video.paused) video.play();
                    else video.pause();
                } else {
                    plyr.toggleControls(true);
                }
            }
        });

                    </div>
                `;
                panel.appendChild(card);
            });
        }

        function switchStandardChannel(channelObj, el) {
            savedCurrentChannelData = channelObj;
            currentActiveUrl = channelObj.url; 
            
            document.querySelectorAll('.channel-card').forEach(c => c.classList.remove('active'));
            if(el) el.classList.add('active');
            
            document.getElementById('activeTitle').innerText = channelObj.name;
            
            if (hls) { hls.destroy(); hls = null; }
            if (dashPlayer) { dashPlayer.reset(); dashPlayer = null; }

            // MPEG-DASH / DRM ট্র্যাকিং সিস্টেম
            if (channelObj.type === 'dash' || channelObj.url.includes('.mpd')) {
                dashPlayer = dashjs.MediaPlayer().create();
                
                if (channelObj.kid && channelObj.key) {
                    dashPlayer.setProtectionData({
                        "org.w3.clearkey": {
                            "clearkeys": { [channelObj.kid]: channelObj.key }
                        }
                    });
                }
                
                dashPlayer.initialize(video, channelObj.url, true);
                dashPlayer.on(dashjs.MediaPlayer.events.STREAM_INITIALIZED, function() {
                    video.muted = false;
                    video.volume = 1.0;
                });
            } else {
                if (Hls.isSupported()) {
                    hls = new Hls({
                        maxBufferLength: 30,
                        enableWorker: true
                    });
                    hls.loadSource(channelObj.url);
                    hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, function() {
                        video.muted = false; 
                        video.volume = 1.0;
                        video.play().catch(() => {
                            video.muted = true;
                            video.play().then(handleMuteBypass);
                        });
                    });
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = channelObj.url;
                    video.play();
                }
            }
        }

        function handleMuteBypass() {
            const unscrapeAudioLock = () => {
                video.muted = false;
                video.volume = 1.0;
                document.removeEventListener('click', unscrapeAudioLock);
                document.removeEventListener('touchend', unscrapeAudioLock);
            };
            document.addEventListener('click', unscrapeAudioLock);
            document.addEventListener('touchend', unscrapeAudioLock);
        }

        function reloadCurrentStream() {
            if (savedCurrentChannelData) {
                switchStandardChannel(savedCurrentChannelData, document.querySelector('.channel-card.active'));
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderLists();
            
            setTimeout(() => {
                // 'Bein Sports 1' চ্যানেলটিকে ডাটাবেজে ট্র্যাক করে ডিফল্ট অটো-প্লে করা হলো
                const targetIdx = fifaChannels.findIndex(ch => ch.name === "Bein Sports 1");
                const finalIdx = targetIdx !== -1 ? targetIdx : 0;
                
                const defaultCard = document.querySelectorAll('#fifaTabPanel .channel-card')[finalIdx]; 
                if (defaultCard) {
                    switchStandardChannel(fifaChannels[finalIdx], defaultCard);
                }
            }, 400);
        });
    </script>
</body>
