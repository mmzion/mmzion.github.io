<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zion Sports — Ultimate OTT</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <style>
        :root {
            --purple-primary: #7c3aed;
            --purple-bg-dark: #090514;
            --panel-bg: #130a24;
        }

        body { background-color: var(--purple-bg-dark) !important; color: #fff !important; font-family: sans-serif; }

        /* 📺 স্টিকি প্লেয়ার */
        .sticky-player { position: sticky; top: 0; z-index: 1000; background: #000; width: 100%; aspect-ratio: 16/9; }
        video { width: 100%; height: 100%; object-fit: contain; }

        /* 📦 ছোট গ্রিড বক্স সিস্টেম */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr); /* ছোট বক্সের জন্য ৪ কলাম */
            gap: 8px;
            padding: 10px;
        }

        .channel-box {
            background: var(--panel-bg);
            border-radius: 8px;
            padding: 8px;
            text-align: center;
            cursor: pointer;
            border: 1px solid rgba(124, 58, 237, 0.2);
            transition: 0.2s;
        }
        .channel-box:hover { border-color: var(--purple-primary); }
        .channel-box.active { border: 2px solid var(--purple-primary); }
        
        .box-logo { width: 25px; height: 25px; object-fit: contain; margin-bottom: 5px; }
        .box-name { font-size: 8px; font-weight: 700; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* ট্যাব মেনু নিচে নিচে কাজ করবে */
        .tab-menu { display: flex; flex-wrap: wrap; gap: 5px; padding: 10px; justify-content: center; }
        .tab-btn { background: #2d1b4e; color: #fff; border: none; padding: 6px 12px; border-radius: 5px; font-size: 11px; font-weight: 600; }
        .tab-btn.active { background: var(--purple-primary); }

        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="sticky-player">
        <video id="player" playsinline controls autoplay></video>
    </div>

    <!-- ট্যাব মেনু -->
    <div class="tab-menu">
        <button class="tab-btn active" onclick="showTab('fifa', this)">FIFA</button>
        <button class="tab-btn" onclick="showTab('sports', this)">SPORTS</button>
        <button class="tab-btn" onclick="showTab('bangla', this)">BANGLA</button>
        <button class="tab-btn" onclick="showTab('channels', this)">ALL</button>
    </div>

    <!-- গ্রিড এরিয়া -->
    <div id="fifaTabPanel" class="grid-container"></div>
    <div id="sportsTabPanel" class="grid-container hidden"></div>
    <div id="banglaTabPanel" class="grid-container hidden"></div>
    <div id="channelsTabPanel" class="grid-container hidden"></div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>
    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

    <script>
        const apiUrls = {
            fifa: "https://iamshajon.com/playlist/fifa.json",
            sports: "https://iamshajon.com/playlist/sports.json",
            bangla: "https://iamshajon.com/playlist/bangla.json",
            channels: "https://iamshajon.com/playlist/channels.json"
        };

        let database = { fifa: [], sports: [], bangla: [], channels: [] };
        const video = document.getElementById('player');
        const plyr = new Plyr(video, { autoplay: true });

        async function init() {
            const [f, s, b, c] = await Promise.all([
                fetch(apiUrls.fifa).then(r => r.json()).catch(() => []),
                fetch(apiUrls.sports).then(r => r.json()).catch(() => []),
                fetch(apiUrls.bangla).then(r => r.json()).catch(() => []),
                fetch(apiUrls.channels).then(r => r.json()).catch(() => [])
            ]);
            database = { fifa: f, sports: s, bangla: b, channels: c };
            
            render('fifa', 'fifaTabPanel');
            render('sports', 'sportsTabPanel');
            render('bangla', 'banglaTabPanel');
            render('channels', 'channelsTabPanel');
        }

        function render(key, id) {
            const p = document.getElementById(id);
            database[key].forEach(ch => {
                const box = document.createElement('div');
                box.className = 'channel-box';
                box.innerHTML = `<img src="${ch.logo || 'https://i.ibb.co.com/ymJhZWxG/1000075445-clean.png'}" class="box-logo"><div class="box-name">${ch.name}</div>`;
                box.onclick = () => play(ch, box);
                p.appendChild(box);
            });
        }

        function showTab(key, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.querySelectorAll('.grid-container').forEach(c => c.classList.add('hidden'));
            document.getElementById(key + 'TabPanel').classList.remove('hidden');
        }

        function play(ch, el) {
            document.querySelectorAll('.channel-box').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            if (ch.type === 'dash') {
                const p = dashjs.MediaPlayer().create();
                p.initialize(video, ch.url, true);
            } else {
                const h = new Hls();
                h.loadSource(ch.url);
                h.attachMedia(video);
            }
        }

        init();
    </script>
</body>
</html>
