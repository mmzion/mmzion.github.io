<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zion Sports — Redirecting...</title>
    <style>
        body {
            background-color: #090514;
            color: #f1f5f9;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .redirect-container {
            max-width: 500px;
            background: rgba(22, 14, 45, 0.6);
            padding: 40px 30px;
            border-radius: 16px;
            border: 1px solid rgba(124, 58, 237, 0.2);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 {
            color: #7c3aed;
            font-size: 24px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        p {
            font-size: 15px;
            line-height: 1.6;
            color: #cbd5e1;
        }
        .timer {
            font-weight: 700;
            color: #FFD700;
        }
        .btn-redirect {
            display: inline-block;
            margin-top: 20px;
            background: #7c3aed;
            color: #fff;
            text-decoration: none;
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.4);
            transition: all 0.2s;
            cursor: pointer;
            border: none;
            outline: none;
        }
        .btn-redirect:hover {
            background: #6d28d9;
            transform: translateY(-2px);
        }
        .footer {
            margin-top: 30px;
            font-size: 11px;
            color: #7c7299;
        }
    </style>
</head>
<body>

    <div class="redirect-container">
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="#7c3aed" class="bi bi-arrow-right-circle" viewBox="0 0 16 16" style="margin-bottom: 15px;">
            <path fill-rule="evenodd" d="M1 8a7 7 0 1 0 14 0A7 7 0 0 0 1 8m15 0A8 8 0 1 1 0 8a8 8 0 0 1 16 0M4.5 7.5a.5.5 0 0 0 0 1h5.793l-2.147 2.146a.5.5 0 0 0 .708.708l3-3a.5.5 0 0 0 0-.708l-3-3a.5.5 0 1 0-.708.708L10.293 7.5z"/>
        </svg>
        <h1>Moving to New Server</h1>
        <p>Zion Sports is offline here due to lack of support. We are redirecting you to our active platform in <span class="timer" id="countdown">5</span> seconds...</p>
        
        <button onclick="doRedirect()" class="btn-redirect">Go to App Now</button>
        
        <div class="footer">© 2026 Zion Sports • All Rights Reserved</div>
    </div>

    <script>
        let timeLeft = 5;
        const countdownEl = document.getElementById('countdown');
        const targetUrl = 'https://fifalive.click/play';
        
        // রিডিরেক্ট ফাংশন
        function doRedirect() {
            clearInterval(timer); // টাইমার ক্লিয়ার করা হলো যাতে লুপ না চলে
            window.location.href = targetUrl;
        }

        // ৫ সেকেন্ড কাউন্টডাউন টাইমার
        const timer = setInterval(() => {
            timeLeft--;
            countdownEl.innerText = timeLeft;
            if (timeLeft <= 0) {
                doRedirect(); // ৫ সেকেন্ড শেষ হলে অটো রিডিরেক্ট
            }
        }, 1000);
    </script>
</body>
</html>
